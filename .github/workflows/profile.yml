name: Update profile

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:
  push:
    paths:
      - profile.config.json
      - scripts/**
      - assets/icons/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Official actions, current majors (they run on the Node 24 runtime).
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node used by OUR generator (scripts/build.mjs). Unrelated to the runtime the actions use.
          node-version: 22
          package-manager-cache: false

      - name: Generate README and SVG assets
        run: node scripts/build.mjs
        env:
          # Built-in token: read-only access to public data. No secrets to configure.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}

      # Only reached if the build succeeded: on failure the job stops here and the last
      # valid files stay in the repository.
      - name: Commit changes (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.es.md assets/generated assets/icons
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(profile): refresh generated assets"
            git push || { git pull --rebase origin "$GITHUB_REF_NAME" && git push; }
          fi
